map $http_upgrade $outfit_connection_upgrade {
    default upgrade;
    '' close;
}

upstream outfit_ui {
    zone outfit_ui 64k;
    # Compose 更换页面容器时，重新解析 Docker 内部的服务名。
    resolver 127.0.0.11 valid=10s ipv6=off;
    server ui:8501 resolve;
}

upstream outfit_api {
    zone outfit_api 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server api:8000 resolve;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 12m;

    # 浏览器直接收取 FastAPI 的登录响应和 Cookie。
    location /browser-auth/ {
        proxy_pass http://outfit_api;
        proxy_set_header Host $http_host;
    }

    # JSON 接口对外暴露同一入口，便于用 curl 或 .http 文件调试 /api/ 下的接口。
    location /api/ {
        proxy_pass http://outfit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # Streamlit 的页面、静态资源和 WebSocket 走同一个入口。
    location / {
        proxy_pass http://outfit_ui;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $outfit_connection_upgrade;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }
}
