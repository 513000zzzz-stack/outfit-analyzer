name: outfit-analyzer

x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg://outfit:${DB_PASSWORD:?请在 .env 设置 DB_PASSWORD}@db:5432/outfit
  REDIS_URL: redis://redis:6379/0
  STORAGE_DIR: /var/lib/outfit
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

# 容器日志默认不限制大小，按 10 MB × 3 份轮转，避免长期运行撑满磁盘。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: outfit
      POSTGRES_USER: outfit
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 设置 DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "outfit", "-d", "outfit"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    logging: *default-logging
    init: true
    environment:
      <<: *app-environment
      JWT_SECRET: ${JWT_SECRET:?请在 .env 设置 JWT_SECRET}
    volumes:
      - analysis-data:/var/lib/outfit
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    logging: *default-logging
    init: true
    environment:
      <<: *app-environment
      ARK_API_KEY: ${ARK_API_KEY:?请在 .env 设置 ARK_API_KEY}
      ARK_MODEL: ${ARK_MODEL:?请在 .env 设置 ARK_MODEL}
      YOLO_WEIGHTS: /models/best.pt
      YOLO_DEVICE: ${YOLO_DEVICE:-cpu}
    volumes:
      - analysis-data:/var/lib/outfit
      - type: bind
        source: ${WEIGHTS_FILE:-./models/best.pt}
        target: /models/best.pt
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 6m

  ui:
    build:
      context: .
      target: ui
    restart: unless-stopped
    logging: *default-logging
    init: true
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      ui:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  analysis-data:
